[package]
name    = "mezze-python"
version = "0.5.0"

# Two library entry points, both re-exported to consumers via the
# package's snake_case module name `mezze_python`:
#   use mezze_python::python::{ Python, GraalPy, PyForeign, ... }
#   use mezze_python::codec::{ ToPy, FromPy, PythonC }
#
# ModuleResolver.resolveModuleFile walks `.deps/mezze/mezze_python-*/src/`
# so `mezze_python::python` resolves to `src/python.mz` etc. without any
# explicit [lib] entry — the search paths already cover the layout.

# ─── polyglot provider ────────────────────────────────────────────
#
# Declares this package as the `python` polyglot provider.
# `mez sync` picks the install template up when a user project has
# `[polyglot.python]` with pip specifiers. `graalpy` is expected on
# PATH — Phase 6 ships a bundled toolchain graalpy; today the
# developer wires PATH to `interpreter/build/graalpy-venv/venv/bin`
# (see the mezze-polyglot Justfile). `{dest}` expands to
# `runtime_dir` under the user project's root; `{prefix}` (the
# provider package's on-disk location) is unused by this template
# but still substituted by `mez sync`.
#
# `-j1` + `-Dblas=none -Dlapack=none` are documented graalpy-venv
# bootstrap knobs — parallel builds of NumPy's AVX2 dispatch OOM
# under graalpy, and BLAS/LAPACK stubs keep the install
# self-contained. `--no-cache-dir` avoids sharing wheels with a
# host CPython.
[polyglot.provider]
language    = "python"
install     = "graalpy -m pip install --disable-pip-version-check --no-cache-dir --config-settings=setup-args=-Dblas=none --config-settings=setup-args=-Dlapack=none --config-settings=compile-args=-j1 --target {dest} {packages}"
runtime_env = "PYTHONPATH"
runtime_dir = ".deps/python"

# ─── Maven coordinates ─────────────────────────────────────────────
#
# Every entry lands on the wire-child JVM classpath via Aether's
# resolution into `~/.mezze/cache/maven/`. Transitive deps come
# along for free (this is why `[maven]` supersedes `[jars]` — no
# manual sha bookkeeping, real dependency management).
#
# Maven Central hosts the GraalPy jars; the mezze-lang maven repo
# hosts `polyglot-python-natives`. Both are declared below.
[maven]
"org.graalvm.python:python-language"          = "25.0.3"
"org.graalvm.python:python-resources"         = "25.0.3"
"org.graalvm.python:python-launcher"          = "25.0.3"
"dev.mezze:polyglot-python-natives"           = "0.2.0"

[[maven-repo]]
id  = "mezze-lang"
url = "https://raw.githubusercontent.com/mezze-lang/mezze-maven/main/"
